<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LocalLoop</title>
    <link rel="stylesheet" href="pages.css">
</head>
<body>

<header class="navbar">
    <a href="../index.html" class="logo">Local<span>Loop.</span></a>

    <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <a href="login.html" class="btn btn-outline">Login</a>
</header>

<main class="container">

    <section class="form-card">
        <h1>Create Account</h1>
        <p>Join LocalLoop and connect with trusted local professionals.</p>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <div class="form-group">
                <label for="role">I want to join as</label>
                <select id="role" required>
                    <option value="">Select your role</option>
                    <option value="customer">Customer</option>
                    <option value="provider">Service Provider</option>
                </select>
            </div>

            <button type="submit" class="btn">Create Account</button>

        </form>

        <div class="form-bottom">
            Already have an account?
            <a href="login.html">Login</a>
        </div>
    </section>

</main>

<footer>
    <h3>LocalLoop.</h3>
    <p>Discover Local Services. Compare. Connect.</p>
</footer>
<script>
const API_URL = "http://localhost:5000/api";

document.getElementById("signupForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    // Get form values
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const role = document.getElementById("role").value;

    // Check password matching
    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    // Connect to backend
    try {

        const response = await fetch(`${API_URL}/auth/register`, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password,
                role: role
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Registration failed!");
            return;
        }

        alert("Account created successfully! Please login.");

        window.location.href = "login.html";

    } catch (error) {

        console.error("Signup error:", error);

        alert("Unable to connect to server. Please try again.");

    }

});
</script>

</body>
</html>
