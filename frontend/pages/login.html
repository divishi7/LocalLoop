<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LocalLoop</title>
    <link rel="stylesheet" href="pages.css">
</head>

<body>

<header class="navbar">
    <a href="../index.html" class="logo">Local<span>Loop.</span></a>

    <nav class="nav-links">
        <a href="../index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <a href="signup.html" class="btn">Sign Up</a>
</header>

<main class="container">

    <section class="form-card">
        <h1>Welcome Back!</h1>
        <p>Login to discover and connect with local professionals.</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="form-group">
                <label for="role">Login As</label>
                <select id="role" required>
                    <option value="">Select your role</option>
                    <option value="customer">Customer</option>
                    <option value="provider">Service Provider</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn">Login</button>

        </form>

        <div class="form-bottom">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </div>
    </section>

</main>

<footer>
    <h3>LocalLoop.</h3>
    <p>Discover Local Services. Compare. Connect.</p>
</footer>

<!-- LOGIN BACKEND INTEGRATION -->

<script>
const API_URL = "http://localhost:5000/api";

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const selectedRole = document.getElementById("role").value;

    try {

        const response = await fetch(`${API_URL}/auth/login`, {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Login failed!");
            return;
        }

        if (selectedRole !== data.user.role) {
            alert(`This account belongs to the ${data.user.role} role.`);
            return;
        }

        // Save token and user details
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        alert("Login successful!");

        // Redirect according to user role
        if (data.user.role === "customer") {
            window.location.href = "customer-dashboard.html";
        } 
        else if (data.user.role === "provider") {
            window.location.href = "provider-dashboard.html";
        }
        else if (data.user.role === "admin") {
            alert("Admin dashboard is not configured yet.");
        }

    } catch (error) {

        console.error("Login error:", error);
        alert("Unable to connect to server. Please try again.");

    }

});
</script>

</body>
</html>
